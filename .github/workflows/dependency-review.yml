# Fails a pull request that adds a dependency with a known vulnerability (ADR-0006).
# Make it a required check on main so a failing PR can't be merged (ADR-0007).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # Free on public repos. Private repos need GitHub's paid code security product: once you have it,
    # set the repository variable HAS_CODE_SECURITY to true. Until then this job is skipped.
    if: ${{ !github.event.repository.private || vars.HAS_CODE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
