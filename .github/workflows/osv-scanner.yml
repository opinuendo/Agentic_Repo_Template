# Scans lockfiles against the open-source OSV vulnerability database (ADR-0006).
# The weekly run catches vulnerabilities published after code was merged.
name: OSV-Scanner

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Find lockfiles
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        name: Look for files OSV-Scanner can read
        run: |
          # Until the repo has dependencies there is nothing to scan, and the scanner would fail.
          files=$(git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lock|requirements[^/]*\.txt|Pipfile\.lock|poetry\.lock|uv\.lock|pdm\.lock|go\.mod|Cargo\.lock|Gemfile\.lock|composer\.lock|pom\.xml|gradle\.lockfile|packages\.lock\.json|pubspec\.lock|mix\.lock|renv\.lock|conan\.lock)$' || true)
          if [ -n "$files" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Scanning:"; echo "$files"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=OSV-Scanner skipped::No lockfiles yet, so there are no dependencies to scan."
          fi

  scan-pr:
    name: Scan pull request
    needs: detect
    if: ${{ github.event_name == 'pull_request' && needs.detect.outputs.found == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write # to show results in the Security tab
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # The Security tab upload is free on public repos; private repos need GitHub's paid product.
      upload-sarif: ${{ !github.event.repository.private }}

  scan-scheduled:
    name: Scan main
    needs: detect
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.found == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      upload-sarif: ${{ !github.event.repository.private }}
