# Dependabot keeps dependencies up to date (ADR-0006). Alerts and security updates are switched on in
# the repo settings (ADR-0007); this file sets how its pull requests look and what else it watches.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Keeps the pinned GitHub Actions in .github/workflows/ current. Works from day one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)" # passes the commit-message check (ADR-0002, ADR-0008)

  # Once the repo has a package manager, uncomment this block and set package-ecosystem to it,
  # for example npm, pip, uv, gomod, cargo, maven, gradle, bundler, nuget or composer.
  # GitHub rejects a value it doesn't know, which is why this ships commented out.
  # - package-ecosystem: "<your package manager>"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "chore(deps)"
